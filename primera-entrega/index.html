<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Vicente Miranda-Juan Cappanera" />
    <meta name="description" content="Pagina orientada a las olas y el surf" />
    <meta name="keywords" content="surf, olas, pais, oceano" />

    <link rel="icon" href="imagenes/logo.jpg" type="image/jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link href="style.css" type="text/css" rel="stylesheet" />
    <script type="text/javascript" src="misFunciones.js"></script>

    <title>WavesSpot</title>
  </head>

  <body>
    <header class="main-header">
      <div class="logo-titulo">
        <img src="imagenes/logo.jpg" alt="Logo surf" class="logo" />
        <div class="titulos">
          <h1>WaveSpots</h1>
          <h5>Global Surf Information</h5>
        </div>
      </div>
      <div class="search-container">
        <label for="Busqueda">Busqueda</label>
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="Busqueda"
          name="busqueda"
          placeholder="Buscar por nombre, ciudad o país..."
          maxlength="30"
          size="30"
          onchange="filtrarTarjeta()"
        />
      </div>

      <section class="filters-grid">
        <div class="filter-group">
          <label for="Pais">PAÍS</label>
          <div class="select-wrapper">
            <span class="field-icon">🚩</span>
            <select name="Pais" id="Pais" onchange="filtrarTarjeta()">
              <option value="">Todos</option>
              <option value="Brasil">Brasil</option>
              <option value="USA">USA</option>
              <option value="Mexico">México</option>
              <option value="Costa Rica">Costa Rica</option>
              <option value="El Salvador">El Salvador</option>
              <option value="Peru">Perú</option>
              <option value="Chile">Chile</option>
              <option value="Portugal">Portugal</option>
              <option value="Francia">Francia</option>
              <option value="España">España</option>
              <option value="Irlanda">Irlanda</option>
              <option value="Reino Unido">Reino Unido</option>
              <option value="Sudafrica">Sudáfrica</option>
              <option value="Namibia">Namibia</option>
              <option value="Marruecos">Marruecos</option>
              <option value="Indonesia">Indonesia</option>
              <option value="Fiji">Fiji</option>
              <option value="Australia">Australia</option>
              <option value="Nueva Zelanda">Nueva Zelanda</option>
              <option value="Sri Lanka">Sri Lanka</option>
              <option value="Filipinas">Filipinas</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label for="Nivel">NIVEL</label>
          <div class="select-wrapper">
            <span class="field-icon">📊</span>
            <select name="Nivel" id="Nivel" onchange="filtrarTarjeta()">
              <option value="">Todos</option>
              <option value="Principiante">Principiante</option>
              <option value="Intermedio">Intermedio</option>
              <option value="Avanzado">Avanzado</option>
              <option value="Experto">Experto</option>
              <option value="Profesional">Profesional</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label for="Oceano">OCÉANO / MAR</label>
          <div class="select-wrapper">
            <span class="field-icon">🌙</span>
            <select name="Oceano" id="Oceano" onchange="filtrarTarjeta()">
              <option value="">Todos</option>
              <option value="Pacifico">Pacífico</option>
              <option value="Atlantico">Atlántico</option>
              <option value="Antartico">Antártico</option>
              <option value="Mar Cantabrico">Mar Cantábrico</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label for="Ola">TIPO DE OLA</label>
          <div class="select-wrapper">
            <span class="field-icon">⇅</span>
            <select name="Ola" id="Ola" onchange="filtrarTarjeta()">
              <option value="">Todos</option>
              <option value="Reef Break">Reef break</option>
              <option value="Beach Break">Beach break</option>
              <option value="Point Break">Point break</option>
              <option value="River Mouth">River mouth</option>
            </select>
          </div>
        </div>
      </section>
    </header>

    <main>
      <div class="mapa-container">
        <img src="imagenes/mapamundi.jpg" alt="Mapa mundial" class="mapa" />

        <button class="punto saquearema" onclick="mostrarSpot('Saquarema')">
          ●
        </button>

        <button class="punto pipeline" onclick="mostrarSpot('Pipeline')">
          ●
        </button>

        <button
          class="punto puerto-escondido"
          onclick="mostrarSpot('Puerto Escondido')"
        >
          ●
        </button>

        <button class="punto pavones" onclick="mostrarSpot('Pavones')">
          ●
        </button>

        <button class="punto punta-roca" onclick="mostrarSpot('Punta Roca')">
          ●
        </button>

        <button class="punto chicama" onclick="mostrarSpot('Chicama')">
          ●
        </button>

        <button
          class="punto punta-de-lobos"
          onclick="mostrarSpot('Punta de Lobos')"
        >
          ●
        </button>

        <button class="punto nazare" onclick="mostrarSpot('Nazaré')">●</button>

        <button class="punto hossegor" onclick="mostrarSpot('Hossegor')">
          ●
        </button>

        <button class="punto mundaka" onclick="mostrarSpot('Mundaka')">
          ●
        </button>

        <button class="punto bundoran" onclick="mostrarSpot('Bundoran')">
          ●
        </button>

        <button class="punto thurso-east" onclick="mostrarSpot('Thurso East')">
          ●
        </button>

        <button
          class="punto jeffreys-bay"
          onclick="mostrarSpot('Jeffreys Bay')"
        >
          ●
        </button>

        <button
          class="punto skeleton-bay"
          onclick="mostrarSpot('Skeleton Bay')"
        >
          ●
        </button>

        <button
          class="punto anchor-point"
          onclick="mostrarSpot('Anchor Point')"
        >
          ●
        </button>

        <button class="punto uluwatu" onclick="mostrarSpot('Uluwatu')">
          ●
        </button>

        <button class="punto cloudbreak" onclick="mostrarSpot('Cloudbreak')">
          ●
        </button>

        <button
          class="punto snapper-rocks"
          onclick="mostrarSpot('Snapper Rocks')"
        >
          ●
        </button>

        <button class="punto raglan" onclick="mostrarSpot('Raglan')">●</button>

        <button class="punto arugam-bay" onclick="mostrarSpot('Arugam Bay')">
          ●
        </button>

        <button class="punto cloud-9" onclick="mostrarSpot('Cloud 9')">
          ●
        </button>
      </div>
    </main>

    <footer>
      <div id="listaSpots"></div>
    </footer>
  </body>
</html>
